name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Unit tests (presentation.test.ts) launch Chromium via Playwright.
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
